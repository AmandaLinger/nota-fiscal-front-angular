<main class="products-container">
  <div class="title-container">
    <h1>Lista de notas fiscais</h1>
    <p class="subtitle">Relatório de todas notas fiscais emitidas.</p>
  </div>

  <div id="data-grid-demo">
    <dx-data-grid
      id="gridContainer"
      [dataSource]="dataSource"
      keyExpr="id"
      [showBorders]="true"
    (onSaving)="onSavingNota($event)"
    >
    <dxo-data-grid-paging [enabled]="false"></dxo-data-grid-paging>
    <dxo-data-grid-editing
      mode="popup"
      [allowUpdating]="true"
      [allowAdding]="true"
      [allowDeleting]="true"
    >
      <dxo-data-grid-popup
        title="Informações"
        [showTitle]="true"
        [width]="700"
        [height]="525"
      >
      </dxo-data-grid-popup>
      <dxo-data-grid-form>
        <dxi-data-grid-item itemType="group" [colCount]="1" [colSpan]="1">
          <dxi-data-grid-item dataField="numeroNotaFiscal"></dxi-data-grid-item>
          <dxi-data-grid-item dataField="cliente"></dxi-data-grid-item>
          <dxi-data-grid-item dataField="produto"></dxi-data-grid-item>
          <dxi-data-grid-item dataField="quantidade"></dxi-data-grid-item>
        </dxi-data-grid-item>

      </dxo-data-grid-form>
    </dxo-data-grid-editing>

    <dxi-data-grid-column dataField="id" dataType="number">
    </dxi-data-grid-column>
    <dxi-data-grid-column dataField="numeroNotaFiscal" dataType="number">
    </dxi-data-grid-column>
    <dxi-data-grid-column dataField="data" dataType="date">
    </dxi-data-grid-column>
    <dxi-data-grid-column dataField="cliente" dataType="number">
    </dxi-data-grid-column>
    <dxi-data-grid-column dataField="precoTotal" dataType="number">
    </dxi-data-grid-column>

  </dx-data-grid>
</div>
</main>
