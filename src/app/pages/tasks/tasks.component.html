<dx-data-grid
  [dataSource]="notas"
  [width]="'100%'"
  [height]="600"
  [showBorders]="true">

  <!-- Configurações -->

  <dxo-data-grid-filter-row [visible]="true"></dxo-data-grid-filter-row>

  <dxo-data-grid-header-filter [visible]="true"></dxo-data-grid-header-filter>

  <dxo-data-grid-group-panel [visible]="true"></dxo-data-grid-group-panel>

  <dxo-data-grid-scrolling mode="virtual"></dxo-data-grid-scrolling>

  <dxo-data-grid-editing
    mode="row"
    [allowAdding]="false"
    [allowUpdating]="false"
    [allowDeleting]="false">
  </dxo-data-grid-editing>

  <dxo-data-grid-grouping
    [autoExpandAll]="false">
  </dxo-data-grid-grouping>

  <dxo-data-grid-master-detail
    [enabled]="true"
    template="detail">
  </dxo-data-grid-master-detail>

  <!-- Colunas -->

  <dxi-data-grid-column
    dataField="numeroNotaFiscal"
    caption="Número">
  </dxi-data-grid-column>

  <dxi-data-grid-column
    dataField="data"
    dataType="date"
    caption="Data">
  </dxi-data-grid-column>

  <dxi-data-grid-column
    dataField="cliente.nome"
    caption="Cliente">
  </dxi-data-grid-column>

  <dxi-data-grid-column
    dataField="precoTotal"
    caption="Valor Total">
  </dxi-data-grid-column>

  <!-- Detail -->

  <div *dxTemplate="let nota of 'detail'">

    <dx-data-grid
      [dataSource]="nota.data.itens"
      [showBorders]="true">

      <dxi-data-grid-column
        dataField="produto.nome"
        caption="Produto">
      </dxi-data-grid-column>

      <dxi-data-grid-column
        dataField="quantidade"
        caption="Quantidade">
      </dxi-data-grid-column>

      <dxi-data-grid-column
        dataField="precoUnitario"
        caption="Preço Unitário">
      </dxi-data-grid-column>

    </dx-data-grid>

  </div>

</dx-data-grid>
